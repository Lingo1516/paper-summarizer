<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paper Summarizer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);color:#e0e0e0;padding:20px}
#app{max-width:700px;margin:0 auto}
.header{text-align:center;margin-bottom:30px;padding:20px 0}
.header h1{font-size:28px;font-weight:800;color:#fff;margin-bottom:8px}
.header p{color:#8892b0;font-size:14px}
.card{background:#1e1e3f;border-radius:16px;padding:24px;margin-bottom:16px;border:1px solid #2a2a4a;box-shadow:0 8px 32px rgba(0,0,0,0.3)}
textarea{width:100%;min-height:150px;background:#0d0d1a;border:1.5px solid #2a2a4a;border-radius:12px;padding:16px;color:#e0e0e0;font-size:14px;line-height:1.6;resize:vertical;font-family:inherit}
textarea:focus{outline:none;border-color:#4f46e5}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;margin-top:16px;transition:opacity 0.2s}
.btn:hover{opacity:0.9}
.btn:disabled{background:#374151;color:#6b7280;cursor:not-allowed}
.drop-zone{border:2px dashed #374151;border-radius:12px;padding:30px;text-align:center;color:#6b7280;cursor:pointer;transition:all 0.2s;margin-top:12px}
.drop-zone:hover{border-color:#4f46e5;color:#4f46e5}
.drop-zone.drag{border-color:#4f46e5;background:rgba(79,70,229,0.1)}
.spinner{display:none;text-align:center;padding:20px;color:#8892b0}
.results{display:none;margin-top:20px}
.result-card{background:#1e1e3f;border-radius:12px;padding:20px;border-left:4px solid #4f46e5;margin-bottom:12px}
.result-card h3{font-size:13px;font-weight:700;color:#8b9dc3;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px}
.result-card p{font-size:14px;line-height:1.7;color:#c9d1d9}
.result-card ul{padding-left:18px}
.result-card li{margin-bottom:6px;font-size:14px;line-height:1.5}
.tag{display:inline-block;background:#2a2a4a;padding:4px 10px;border-radius:20px;font-size:12px;color:#8b9dc3;margin-right:6px;margin-bottom:6px}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div style="font-size:48px;margin-bottom:12px">📄</div>
    <h1>Paper Summarizer</h1>
    <p>上傳論文，AI 自動產生結構化摘要</p>
  </div>

  <div class="card">
    <textarea id="paper-text" placeholder="貼上論文全文，或下方拖入 PDF 檔案..."></textarea>
    <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
      <div style="font-size:32px;margin-bottom:8px">📎</div>
      <div>或點擊上傳 PDF 檔案</div>
    </div>
    <input type="file" id="file-input" accept=".pdf" style="display:none" onchange="handleFile(this.files[0])">
  </div>

  <button class="btn" id="btn-summarize" onclick="summarize()" disabled>✨ 開始摘要</button>

  <div class="spinner" id="spinner">
    <div style="font-size:32px;margin-bottom:12px">⏳</div>
    <div>AI 正在分析論文...</div>
  </div>

  <div class="results" id="results"></div>
</div>

<script>
let pdfText = '';

const textarea = document.getElementById('paper-text');
const dropZone = document.getElementById('drop-zone');
const btn = document.getElementById('btn-summarize');

textarea.addEventListener('input', checkInput);

dropZone.addEventListener('dragover', e => {
  e.preventDefault();
  dropZone.classList.add('drag');
});

dropZone.addEventListener('dragleave', () => {
  dropZone.classList.remove('drag');
});

dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag');
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});

async function handleFile(file) {
  if (!file || file.type !== 'application/pdf') {
    alert('請上傳 PDF 檔案');
    return;
  }
  const reader = new FileReader();
  reader.onload = e => {
    pdfText = e.target.result;
    textarea.value = `[PDF: ${file.name}] 已載入 (${Math.round(file.size/1024)}KB)`;
    dropZone.innerHTML = `<div style="font-size:32px;margin-bottom:8px">✅</div><div>${file.name}</div>`;
    checkInput();
  };
  reader.readAsDataURL(file);
}

function checkInput() {
  const hasText = textarea.value.trim().length > 0;
  btn.disabled = !hasText;
}

async function summarize() {
  const text = textarea.value.trim();
  if (!text) return;

  btn.disabled = true;
  document.getElementById('spinner').style.display = 'block';
  document.getElementById('results').style.display = 'none';

  try {
    const formData = new FormData();
    formData.append('text', text);

    const res = await fetch('/api/summarize', {
      method: 'POST',
      body: formData
    });

    const data = await res.json();

    if (data.error) throw new Error(data.error);

    displayResults(data.text);
  } catch (e) {
    alert('摘要失敗：' + e.message);
  } finally {
    document.getElementById('spinner').style.display = 'none';
    btn.disabled = false;
  }
}

function displayResults(text) {
  let html = '<div class="card">';
  
  try {
    const json = JSON.parse(text.replace(/^```json\s*/, '').replace(/\s*```$/, ''));
    
    if (json['標題']) html += `<div class="result-card"><h3>標題</h3><p>${escHtml(json['標題'])}</p></div>`;
    if (json['作者']) html += `<div class="result-card"><h3>作者</h3><p>${escHtml(json['作者'])}</p></div>`;
    if (json['摘要']) html += `<div class="result-card"><h3>摘要</h3><p>${escHtml(json['摘要'])}</p></div>`;
    if (json['研究目的']) html += `<div class="result-card"><h3>研究目的</h3><p>${escHtml(json['研究目的'])}</p></div>`;
    if (json['方法']) html += `<div class="result-card"><h3>方法</h3><p>${escHtml(json['方法'])}</p></div>`;
    if (json['關鍵發現']?.length) {
      html += `<div class="result-card"><h3>關鍵發現</h3><ul>${json['關鍵發現'].map(f=>`<li>${escHtml(f)}</li>`).join('')}</ul></div>`;
    }
    if (json['結論']) html += `<div class="result-card"><h3>結論</h3><p>${escHtml(json['結論'])}</p></div>`;
    if (json['貢獻']) html += `<div class="result-card"><h3>貢獻</h3><p>${escHtml(json['貢獻'])}</p></div>`;
  } catch {
    // fallback: raw text display
    html += `<div class="result-card"><p>${escHtml(text)}</p></div>`;
  }

  html += '</div>';
  document.getElementById('results').innerHTML = html;
  document.getElementById('results').style.display = 'block';
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
